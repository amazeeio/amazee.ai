services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      lagoon.type: postgres

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres/postgres_service}
      AMAZEEAI_JWT_SECRET: ${AMAZEEAI_JWT_SECRET}
      ENV_SUFFIX: ${ENV_SUFFIX:-local}
      ENABLE_METRICS: "true"  # Enable Prometheus metrics
      AI_TRIAL_REGION: ${AI_TRIAL_REGION:-eu-west}
      MOAD_DASHBOARD_API_URL: ${MOAD_DASHBOARD_API_URL:-}
      MOAD_DASHBOARD_API_TOKEN: ${MOAD_DASHBOARD_API_TOKEN:-}
    ports:
      - "8800:8800"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./backend-start.sh:/app/backend-start.sh
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      lagoon.type: python

  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres/postgres_service}
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      lagoon.type: cli

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NEW_DASHBOARD_URL: ${NEXT_PUBLIC_NEW_DASHBOARD_URL:-}
    ports:
      - "3000:3000"
    command:
      - "npm"
      - "run"
      - "dev"
    volumes:
      - ./frontend:/app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8800
    labels:
      lagoon.type: node

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-database}:${LITELLM_TAG:-main-latest}
    ports:
      - "4000:4000" # Map the container port to the host, change the host port if necessary
    environment:
        DATABASE_URL: "postgresql://llmproxy:dbpassword9090@litellm_db:5432/litellm"
        STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
        LITELLM_MASTER_KEY: "sk-1234"
    depends_on:
      - litellm_db  # Indicates that this service depends on the 'db' service, ensuring 'db' starts first
    healthcheck:
      # The litellm images ship no wget/curl; python is always present.
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)" ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    labels:
      lagoon.type: none

  litellm2:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-database}:${LITELLM_TAG:-main-latest}
    ports:
      - "4010:4000"
    environment:
        DATABASE_URL: "postgresql://llmproxy:dbpassword9090@litellm2_db:5432/litellm"
        STORE_MODEL_IN_DB: "True"
        LITELLM_MASTER_KEY: "sk-1234"
    depends_on:
      - litellm2_db
    healthcheck:
      # The litellm images ship no wget/curl; python is always present.
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)" ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    labels:
      lagoon.type: none

  litellm3:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-database}:${LITELLM_TAG:-main-latest}
    ports:
      - "4011:4000"
    environment:
        DATABASE_URL: "postgresql://llmproxy:dbpassword9090@litellm3_db:5432/litellm"
        STORE_MODEL_IN_DB: "True"
        LITELLM_MASTER_KEY: "sk-1234"
    depends_on:
      - litellm3_db
    healthcheck:
      # The litellm images ship no wget/curl; python is always present.
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)" ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    labels:
      lagoon.type: none

  litellm_db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data  # Persists Postgres data across container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10
    labels:
      lagoon.type: none

  litellm2_db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    volumes:
      - litellm2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10
    labels:
      lagoon.type: none

  litellm3_db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    volumes:
      - litellm3_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10
    labels:
      lagoon.type: none

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-init.sh:/usr/local/bin/ollama-init.sh
      - ollama_data:/root/.ollama
    entrypoint: [ "/bin/sh", "/usr/local/bin/ollama-init.sh" ]
    labels:
      lagoon.type: none

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend
    labels:
      lagoon.type: none

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    labels:
      lagoon.type: none

volumes:
  postgres_data:
  litellm_postgres_data:
    name: litellm_postgres_data  # Named volume for Postgres data persistence
  litellm2_postgres_data:
    name: litellm2_postgres_data
  litellm3_postgres_data:
    name: litellm3_postgres_data
  prometheus_data:
  grafana_data:
  ollama_data:
