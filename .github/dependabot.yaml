version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: chore
      include: scope
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: docker
    commit-message:
      prefix: chore
      include: scope
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: pip
    commit-message:
      prefix: chore
      include: scope
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: npm
    commit-message:
      prefix: chore
      include: scope
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
