name: Release Please

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the release PR branch, create the vX.Y.Z tag and GitHub Release
      pull-requests: write  # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: dev

  # Releases created with the default GITHUB_TOKEN never trigger other
  # workflows (GitHub blocks recursive workflow runs), so a
  # `release: published` trigger on the helm workflow would never fire.
  # Publish the charts by calling that workflow directly instead — exactly
  # once per release.
  publish-helm-charts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-package-publish.yml
    with:
      publish: true
    secrets: inherit

  # Tags are cut on `dev`, but prod deploys from `main`. Open the dev -> main
  # PR here so every prod deploy maps to exactly one vX.Y.Z release instead of
  # an undated pile of commits.
  open-prod-deploy-pr:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open or update the dev -> main PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          TITLE="Deploy $TAG to production"
          BODY="Deploys [\`$TAG\`]($REPO_URL/releases/tag/$TAG) to production.

          See the release notes for the full changelog.

          Opened automatically by the Release Please workflow."

          # A previous deploy PR may still be open — merging dev into main is
          # what deploys, so reuse it and retitle it to the newest tag rather
          # than opening a second PR for the same branch pair.
          EXISTING=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated existing prod deploy PR #$EXISTING"
          else
            gh pr create --base main --head dev --title "$TITLE" --body "$BODY"
          fi
