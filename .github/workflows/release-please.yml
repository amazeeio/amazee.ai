name: Release Please

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the release PR branch, create the vX.Y.Z tag and GitHub Release
      pull-requests: write  # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: dev

  # Releases created with the default GITHUB_TOKEN never trigger other
  # workflows (GitHub blocks recursive workflow runs), so a
  # `release: published` trigger on the helm workflow would never fire.
  # Publish the charts by calling that workflow directly instead — exactly
  # once per release.
  publish-helm-charts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-package-publish.yml
    with:
      publish: true
    secrets: inherit

  # Tags are cut on `dev`, but prod deploys from `main`. Open the dev -> main
  # PR here so every prod deploy maps to exactly one vX.Y.Z release instead of
  # an undated pile of commits.
  open-prod-deploy-pr:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # append the user-facing notes to the GitHub Release
      pull-requests: write
    # Shares the group with the refresh job below, because both write this body.
    # Serialized, not cancelled: whoever writes last read git last, so the body
    # ends up describing the newest dev either way.
    concurrency:
      group: prod-deploy-pr-body
      cancel-in-progress: false
    env:
      # Job-level so the AI steps can test it — the `secrets` context is not
      # available in a job-level `if`. Empty means no key configured, which
      # only skips the user-facing release notes. The deploy PR is built from
      # git and does not depend on it.
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      # release-please builds CHANGELOG.md from commit subjects, which describe
      # the code. These notes describe the product, and are read from the actual
      # diff so a vague commit message cannot hide a user-visible change.
      #
      # Tag-to-tag, because a GitHub Release must describe exactly its own
      # version. The deploy PR body is a different job with a different range,
      # and it is built from git rather than written by a model.
      - name: Collect the released range
        if: env.LITELLM_API_KEY != ''
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            # First release: fall back to where release-please started counting.
            PREV=$(jq -er '.["bootstrap-sha"]' release-please-config.json)
          fi
          git rev-parse --verify --quiet "$PREV^{commit}" > /dev/null
          echo "Release range: $PREV..$TAG"

          {
            echo "## Commit log"
            echo
            git log --oneline "$PREV..$TAG"
            echo
            # --stat elides leading directories on long paths, which hides
            # app/migrations/versions/ entirely. List the paths in full.
            echo "## Changed files"
            echo
            git diff --name-status "$PREV..$TAG"
            echo
            echo "## Detailed diff (truncated)"
            echo
            git diff "$PREV..$TAG" -- . ':(exclude,glob)**/package-lock.json' \
              ':(exclude)CHANGELOG.md' | head -3000
          } > /tmp/release-range.md

      # Assemble the prompts here instead of letting the action template them.
      # It substitutes template variables into the raw text of a *.prompt.yml
      # before parsing that text as YAML, and only the first substituted line
      # keeps the block-scalar indentation — so a multi-line diff terminates the
      # scalar and the parse fails. Any prompt file that is not *.prompt.yml is
      # sent verbatim, which is what we want.
      - name: Build the prompt
        if: env.LITELLM_API_KEY != ''
        run: |
          {
            sed "s|{{version}}|$TAG|g" .github/prompts/changelog-user.md
            echo
            cat /tmp/release-range.md
          } > /tmp/user-prompt.md

      # The notes are a convenience; opening the deploy PR is the job's real
      # output. Never let a model or endpoint failure hold back a released
      # version, so the inference step reports but does not fail the job.
      - name: Write the user-facing notes
        id: ai_user
        if: env.LITELLM_API_KEY != ''
        continue-on-error: true
        uses: actions/ai-inference@b81b2afb8390ee6839b494a404766bef6493c7d9 # v1
        with:
          prompt-file: /tmp/user-prompt.md
          model: claude-4-6-sonnet
          max-tokens: 4000
          endpoint: https://litellm.amazeeai-us1.amazeeio.review
          token: ${{ secrets.LITELLM_API_KEY }}

      - name: Keep the user-facing notes
        if: steps.ai_user.outcome == 'success'
        env:
          RESPONSE_FILE: ${{ steps.ai_user.outputs.response-file }}
        run: cp "$RESPONSE_FILE" /tmp/user-notes.md

      - name: Append the user-facing notes to the GitHub Release
        if: steps.ai_user.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release with nothing a user can see is normal — infrastructure and
          # refactor work. The model says so with this sentinel.
          if grep -q "NO_USER_CHANGES" /tmp/user-notes.md; then
            echo "No user-facing changes in $TAG"
            exit 0
          fi

          gh release view "$TAG" --json body --jq .body > /tmp/release-body.md
          {
            echo
            echo "---"
            echo
            cat /tmp/user-notes.md
          } >> /tmp/release-body.md

          gh release edit "$TAG" --notes-file /tmp/release-body.md

      - name: Open or update the dev -> main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout resolved a tag, so no branch is a local ref yet.
          git fetch --quiet origin main dev
          bash .github/scripts/deploy-pr-body.sh origin/main origin/dev "$TAG" > /tmp/pr-body.md

          TITLE="Deploy $TAG to production"

          # A previous deploy PR may still be open — merging dev into main is
          # what deploys, so reuse it and retitle it to the newest tag rather
          # than opening a second PR for the same branch pair.
          EXISTING=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file /tmp/pr-body.md
            echo "Updated existing prod deploy PR #$EXISTING"
          else
            gh pr create --base main --head dev --title "$TITLE" --body-file /tmp/pr-body.md
          fi

  # The body describes what merging dev into main would deploy, so it goes stale
  # the moment anything else lands on dev. Rebuilding it costs one git read, so
  # refresh it on every push instead of letting an approver trust a snapshot.
  # Skipped when a release was just created, because the job above already wrote
  # a fresh body in that same run.
  refresh-prod-deploy-pr:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Same group as the job above. Cancelling is wrong here: a cancelled run can
    # leave the body describing an older dev than the one that would merge, and
    # queueing costs one git read.
    concurrency:
      group: prod-deploy-pr-body
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Find the open deploy PR
        id: find
        run: |
          NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUMBER" ]; then
            echo "No open deploy PR, nothing to refresh"
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.find.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Rewrite the body
        if: steps.find.outputs.number != ''
        env:
          NUMBER: ${{ steps.find.outputs.number }}
        run: |
          git fetch --quiet origin main dev
          # Name the release the deploy carries, which is the newest tag on dev.
          TAG=$(git describe --tags --abbrev=0 origin/dev 2>/dev/null || true)
          bash .github/scripts/deploy-pr-body.sh origin/main origin/dev "$TAG" > /tmp/pr-body.md
          gh pr edit "$NUMBER" --body-file /tmp/pr-body.md
          echo "Refreshed prod deploy PR #$NUMBER"
