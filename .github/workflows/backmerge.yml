name: Back-merge main into dev

# After a release pull request merges, main carries the merge commit and the
# version bump that dev does not have. Someone had to remember to open the
# main -> dev pull request; when nobody did, the two branches drifted. This
# workflow opens it instead.
#
# The App cannot approve its own pull request, so one human approval is still
# needed. Auto-merge does the rest.
on:
  push:
    branches: [ main ]

permissions:
  contents: read

# Two pushes at once would each try to open the same pull request.
concurrency:
  group: backmerge-main-dev
  cancel-in-progress: false

jobs:
  backmerge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Act as the org's automation GitHub App so the pull request it opens gets
      # its checks run (pull requests from the default github.token don't).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ secrets.AMAZEE_AI_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AMAZEE_AI_AUTOMATION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Open or reuse the back-merge pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git fetch --quiet origin main dev

          # A push to main that dev already contains has nothing to carry back.
          if [ -z "$(git rev-list origin/dev..origin/main)" ]; then
            echo "dev already contains main"
            exit 0
          fi

          NUMBER=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')
          if [ -z "$NUMBER" ]; then
            URL=$(gh pr create --base dev --head main \
              --title "Back-merge main into dev" \
              --body "Carries the release commits from main back to dev, so the two branches do not drift.")
            NUMBER=${URL##*/}
            echo "Opened pull request #$NUMBER"
          else
            echo "Reusing pull request #$NUMBER"
          fi

          # gh refuses when auto-merge is already on, which is fine, so check the
          # pull request afterwards instead of trusting the exit code. Anything
          # else, a permission or API error, must fail here: a silent green job
          # would leave dev behind again.
          # Known case: a pull request that is already approved and green is
          # refused too, with no auto-merge request, so this fails and a human
          # merges it by hand.
          if ! gh pr merge "$NUMBER" --auto --merge; then
            STATE=$(gh pr view "$NUMBER" --json state,autoMergeRequest \
              --jq 'if .state == "MERGED" or .autoMergeRequest != null then "ok" else "missing" end')
            if [ "$STATE" != "ok" ]; then
              echo "::error::auto-merge is not enabled on pull request #$NUMBER"
              exit 1
            fi
          fi
