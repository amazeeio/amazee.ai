# https://github.com/cncf/foundation/blob/main/policies-guidance/allowed-third-party-license-policy.md
allow-licenses:
- '0BSD'
- 'Apache-2.0'
- 'BSD-2-Clause'
- 'BSD-2-Clause-FreeBSD'
- 'BSD-3-Clause'
- 'CC-BY-4.0'
- 'CC0-1.0'
- 'ISC'
- 'LGPL-2.0-only'
- 'LGPL-2.0-or-later'
- 'LGPL-2.1-only'
- 'LGPL-2.1-or-later'
- 'LGPL-3.0-only'
- 'LGPL-3.0-or-later'
- 'LicenseRef-scancode-alliance-open-media-patent-1.0'
- 'LicenseRef-scancode-other-permissive'
- 'LicenseRef-scancode-public-domain'
- 'MIT'
- 'MIT-0'
- 'MPL-2.0'
- 'PostgreSQL'
- 'PSF-2.0'
- 'Python-2.0'
- 'Unlicense'
- 'X11'
- 'Zlib'
allow-ghsas:
# python-ecdsa Minerva timing attack on P-256 signing. No patched version exists
# (upstream considers it out of scope). ecdsa is only pulled in transitively by
# python-jose; we sign JWTs with HS256 (app/core/config.py), so the ECDSA code
# path is never used. Drop this entry if python-jose is replaced with PyJWT.
- 'GHSA-wj6h-64fc-37mp'
allow-dependencies-licenses:
# typing-extensions is PSF-2.0 (see its LICENSE), but the scanned license
# expression also picks up a GPL-1.0-or-later mention from a vendored file.
- 'pkg:pypi/typing-extensions'
